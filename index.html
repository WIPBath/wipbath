<style>
  body{margin:0}
  :root{
    --bg:#FFFFFF; --surface:#FFFFFF; --ink:#22101A; --muted:#6B5A63; --line:#EFE3E9;
    --pink:#B10061; --pink-soft:#FBEAF2; --ice:#E4F4FA; --ice-ink:#1D5A70;
    --on-pink:#FFFFFF;
    --display:"Times New Roman", Times, Georgia, serif;
    --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    color-scheme: light;
  }

  [hidden]{display:none!important}
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.55;
    padding-inline:16px; padding-block:48px 32px; -webkit-font-smoothing:antialiased}
  a{color:inherit}
  a:focus-visible{outline:2px solid var(--pink); outline-offset:3px; border-radius:6px}

  .wrap{max-width:720px; margin:0 auto; display:flex; flex-direction:column; gap:56px}
  .top{display:flex; flex-direction:column; gap:28px}

  /* Identity (centred) */
  .hero{display:flex; flex-direction:column; align-items:center; text-align:center}
  .logo{width:132px; height:132px; display:block; border-radius:50%}
  .eyebrow{font-family:var(--mono); font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--pink); margin:24px 0 0}
  h1{font-family:var(--display); font-weight:400; font-size:clamp(44px,9vw,68px); line-height:1; letter-spacing:-.01em; margin:10px 0 0; text-wrap:balance; color:var(--pink)}
  .tagline{color:var(--muted); margin:16px auto 0; max-width:44ch; text-wrap:pretty}

  /* Main actions */
  .actions{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px}
  .cta{display:flex; align-items:center; gap:14px; text-decoration:none; padding:17px 20px; border-radius:14px;
    border:1.5px solid var(--ink); background:var(--surface); transition:transform .15s ease, box-shadow .15s ease}
  .cta:hover{transform:translateY(-2px)}
  .cta .arrow{flex:none; width:34px; height:34px; border-radius:50%; border:1.5px solid currentColor; display:grid; place-items:center}
  .cta .arrow svg{width:18px; height:18px; transition:transform .2s ease}
  .cta:hover .arrow svg{transform:translateX(3px)}
  .cta strong{display:block; font-size:17px; font-weight:700; line-height:1.25}
  .cta span.sub{display:block; font-size:14px; opacity:.85}
  .cta.primary{background:var(--pink); color:var(--on-pink); border-color:var(--pink); box-shadow:0 6px 20px rgba(177,0,97,.22)}
  .cta.primary:hover{box-shadow:0 10px 26px rgba(177,0,97,.28)}

  /* Socials */
  .socials{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}
  .social{display:inline-flex; align-items:center; gap:8px; padding:9px 14px 9px 11px; border-radius:999px; border:1px solid var(--line);
    background:var(--surface); text-decoration:none; font-size:14px; font-weight:600; transition:border-color .15s ease, color .15s ease}
  .social:hover{border-color:var(--pink); color:var(--pink)}
  .social svg{width:18px; height:18px; flex:none}

  /* Section headings */
  .section-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px}
  h2{font-family:var(--display); font-weight:400; font-size:32px; line-height:1.1; margin:0; letter-spacing:-.01em}
  .more{font-size:14px; font-weight:600; color:var(--pink); text-decoration:none; white-space:nowrap}
  .more:hover{text-decoration:underline}

  /* Events */
  .events{list-style:none; margin:0; padding:0; border-top:1px solid var(--line)}
  .event{display:grid; grid-template-columns:68px 1fr auto; gap:16px; padding:16px 0; border-bottom:1px solid var(--line); align-items:center}
  .cal{text-align:center; border:1.5px solid var(--pink); border-radius:10px; overflow:hidden; font-variant-numeric:tabular-nums; background:var(--surface)}
  .cal .m{display:block; background:var(--pink); color:var(--on-pink); font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; padding:3px 0}
  .cal .d{display:block; font-family:var(--display); font-weight:400; font-size:26px; line-height:1; padding:6px 0 7px; white-space:nowrap}
  .cal .d.range{font-size:19px; padding:9px 0 10px}
  .event h3{margin:0; font-size:17px; font-weight:700; line-height:1.3; text-wrap:balance}
  .event .where{margin:3px 0 0; font-size:14px; color:var(--muted)}
  .with{display:inline-block; margin-top:6px; font-family:var(--mono); font-size:11px; letter-spacing:.05em; text-transform:uppercase;
    padding:3px 8px; border-radius:6px; background:var(--ice); color:var(--ice-ink)}
  .register{font-size:14px; font-weight:700; text-decoration:none; padding:8px 14px; border-radius:999px; border:1.5px solid var(--pink); color:var(--pink); white-space:nowrap}
  .register:hover{background:var(--pink); color:var(--on-pink)}
  @media (max-width:520px){
    .event{grid-template-columns:60px 1fr}
    .event .register{grid-column:2; justify-self:start; margin-top:-4px}
  }
  .empty{color:var(--muted); padding:16px 0; margin:0}

  /* Newsletter issue */
  .issue{background:var(--surface); border:1px solid var(--line); border-radius:18px; overflow:hidden; display:grid; grid-template-columns:1fr}
  @media (min-width:600px){ .issue.has-cover{grid-template-columns:200px 1fr} }
  .issue .cover{background:var(--pink-soft); min-height:180px}
  .issue .cover img{width:100%; height:100%; object-fit:cover; display:block}
  .issue .body{padding:24px; display:flex; flex-direction:column; gap:12px}
  .issue .meta{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
  .pill{font-family:var(--mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase; padding:4px 9px; border-radius:6px;
    background:var(--pink-soft); color:var(--pink)}
  .issue .date{font-size:14px; color:var(--muted)}
  .issue h3{font-family:var(--display); font-weight:400; font-size:26px; line-height:1.15; margin:0; text-wrap:balance}
  .issue p{margin:0; color:var(--muted); max-width:60ch}
  .issue ul{list-style:none; margin:4px 0 0; padding:0; display:flex; flex-direction:column; gap:8px}
  .issue li{display:flex; gap:10px; align-items:flex-start}
  .issue li::before{content:""; flex:none; width:14px; height:14px; margin-top:5px; border:1.5px solid var(--pink); border-radius:3px;
    background:linear-gradient(135deg,transparent 42%,var(--pink) 42%,var(--pink) 58%,transparent 58%),
               linear-gradient(45deg,transparent 42%,var(--pink) 42%,var(--pink) 58%,transparent 58%)}
  .btn{align-self:flex-start; margin-top:6px; display:inline-flex; align-items:center; gap:8px; padding:11px 18px; border-radius:10px;
    background:var(--ink); color:var(--bg); text-decoration:none; font-weight:600; font-size:15px}
  .btn:hover{opacity:.9}

  /* Full-screen newsletter reader */
  .reader{position:fixed; inset:0; z-index:50; background:rgba(28,12,20,.94); overflow-y:auto; padding:0 16px 56px;
    -webkit-overflow-scrolling:touch}
  .reader-bar{position:sticky; top:0; display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 0 14px; color:#fff}
  .reader-bar p{margin:0; font-weight:600; font-size:15px}
  .reader-close{appearance:none; border:1.5px solid rgba(255,255,255,.55); background:transparent; color:#fff; cursor:pointer;
    font:inherit; font-weight:600; font-size:14px; padding:8px 16px; border-radius:999px}
  .reader-close:hover{background:#fff; color:var(--ink); border-color:#fff}
  .reader-pages{max-width:860px; margin:0 auto; display:flex; flex-direction:column; gap:20px}
  .reader-pages img{width:100%; height:auto; border-radius:10px; background:#fff; display:block}

  /* Vision */
  .vision{margin:0; font-family:var(--body); font-weight:400; font-size:clamp(17px,2.6vw,19px); line-height:1.6;
    border-left:3px solid var(--pink); padding-left:24px; max-width:56ch; text-wrap:pretty}

  /* Board */
  .board{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px}
  .member{display:flex; align-items:center; gap:22px; padding:16px 0; border-bottom:1px solid var(--line)}
  .member:last-child{border-bottom:0}
  .portrait{flex:none; width:96px; height:96px; border-radius:50%; object-fit:cover; background:var(--pink-soft); display:block}
  .portrait.placeholder{display:grid; place-items:center; border:1.5px dashed var(--line)}
  .portrait.placeholder svg{width:42px; height:42px; color:var(--pink); opacity:.5}
  .member .who{min-width:0}
  .member .name{font-family:var(--display); font-weight:400; font-size:clamp(24px,4.6vw,32px); line-height:1.1; margin:0; letter-spacing:-.01em; text-wrap:balance}
  .member .name.open{color:var(--muted); font-size:clamp(20px,3.6vw,24px)}
  .member .role{margin:6px 0 0; font-family:var(--mono); font-size:12px; letter-spacing:.09em; text-transform:uppercase; color:var(--pink)}
  .member .apply{display:inline-block; margin-top:8px; font-size:14px; font-weight:600; color:var(--pink)}
  @media (max-width:420px){ .portrait{width:76px; height:76px} .member{gap:16px} }

  footer{max-width:720px; margin:56px auto 0; padding-top:20px; border-top:1px solid var(--line); font-size:13px; color:var(--muted);
    display:flex; flex-wrap:wrap; gap:8px 20px; justify-content:space-between}

  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>

</head>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const ext = ' target="_blank" rel="noopener"';
  const img = ref => IMAGES[ref] || ref;

  $("logo").src = IMAGES.logo;
  const fav = document.createElement("link"); fav.rel = "icon"; fav.type = "image/png"; fav.href = IMAGES.logo;
  document.head.appendChild(fav);

  $("place").textContent = SITE.place;
  $("name").textContent = SITE.name;
  $("tagline").textContent = SITE.tagline;
  $("vision").textContent = SITE.vision;
  $("foot").textContent = "© " + new Date().getFullYear() + " " + SITE.name + " Society";

  $("join").href = SITE.joinUrl;
  if (SITE.newsletterSignupUrl) $("signup").href = SITE.newsletterSignupUrl; else $("signup").hidden = true;
  if (SITE.eventsPageUrl) $("allEvents").href = SITE.eventsPageUrl; else $("allEvents").hidden = true;

  /* Socials */
  const icons = {
    instagram:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"/></svg>',
    facebook:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M13 21v-7h2.5l.5-3h-3V9.5c0-.9.4-1.5 1.6-1.5H16V5.4c-.4 0-1.2-.1-2.1-.1-2.1 0-3.4 1.2-3.4 3.5V11H8v3h2.5v7"/></svg>',
    linkedin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 10.5V17M8 7.2v.1M12 17v-6.5M12 13.3c0-1.7 1-2.8 2.4-2.8s2.1 1 2.1 2.7V17"/></svg>',
    email:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M4 7l8 6 8-6"/></svg>'
  };
  const socials = [
    ["instagram","Instagram",SITE.instagram],
    ["facebook","Facebook",SITE.facebook],
    ["linkedin","LinkedIn",SITE.linkedin],
    ["email","Email us",SITE.email ? "mailto:" + SITE.email : ""]
  ];
  $("socials").innerHTML = socials.filter(s => s[2]).map(([k,label,url]) =>
    '<a class="social" href="' + esc(url) + '"' + (k==="email" ? "" : ext) + '>' + icons[k] + label + '</a>'
  ).join("");

  /* Events */
  const today = new Date(); today.setHours(0,0,0,0);
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const parse = s => s ? new Date(s + "T00:00:00") : null;
  const upcoming = SITE.events
    .map(e => ({...e, d: parse(e.date), end: parse(e.endDate) || parse(e.date)}))
    .filter(e => e.d && !isNaN(e.d) && e.end >= today)
    .sort((a,b) => a.d - b.d);
  $("events").innerHTML = upcoming.length ? upcoming.map(e => {
    const multi = e.end > e.d;
    const sameMonth = multi && e.end.getMonth() === e.d.getMonth();
    const month = multi && !sameMonth ? months[e.d.getMonth()] + "–" + months[e.end.getMonth()] : months[e.d.getMonth()];
    const dayNum = multi ? e.d.getDate() + "–" + e.end.getDate() : e.d.getDate();
    const when = multi ? days[e.d.getDay()] + "–" + days[e.end.getDay()] : days[e.d.getDay()];
    const bits = [when, e.time, e.place].filter(Boolean).map(esc).join(" · ");
    return '<li class="event">' +
      '<div class="cal"><span class="m">' + month + '</span><span class="d' + (multi ? " range" : "") + '">' + dayNum + '</span></div>' +
      '<div><h3>' + esc(e.title) + '</h3><p class="where">' + bits + '</p>' +
        (e.with ? '<span class="with">With ' + esc(e.with) + '</span>' : "") + '</div>' +
      (e.url ? '<a class="register" href="' + esc(e.url) + '"' + ext + '>' + esc(e.linkLabel || "Register") + '</a>' : "") +
    '</li>';
  }).join("") : '<li><p class="empty">New events coming soon. Follow us on Instagram to hear first.</p></li>';

  /* Newsletter */
  const n = SITE.newsletter;
  const issue = $("issue");
  const pages = (n.pages || []).filter(Boolean);
  const cover = n.cover || pages[0] || "";
  const meta =
    '<div class="meta"><span class="pill">' + esc(n.issue) + '</span><span class="date">' + esc(n.date) + '</span></div>' +
    '<h3>' + esc(n.headline) + '</h3>' +
    '<p>' + esc(n.intro) + '</p>' +
    (n.highlights && n.highlights.length ? '<ul>' + n.highlights.map(h => '<li>' + esc(h) + '</li>').join("") + '</ul>' : "");

  if (pages.length || n.readUrl) {
    if (cover) issue.classList.add("has-cover");
    issue.innerHTML =
      (cover ? '<div class="cover"><img src="' + esc(img(cover)) + '" alt="Cover of ' + esc(n.issue) + '"></div>' : "") +
      '<div class="body">' + meta +
        (pages.length
          ? '<button class="btn" id="readIssue" type="button">Read the full issue <span aria-hidden="true">→</span></button>'
          : '<a class="btn" href="' + esc(n.readUrl) + '"' + ext + '>Read the full issue <span aria-hidden="true">→</span></a>') +
      '</div>';
  } else {
    issue.innerHTML =
      '<div class="body">' +
        '<div class="meta"><span class="pill">Coming soon</span></div>' +
        '<h3>Our first issue is on its way</h3>' +
        '<p>Society news, upcoming events and opportunities for women in politics, straight from the committee.</p>' +
        (SITE.newsletterSignupUrl
          ? '<a class="btn" href="' + esc(SITE.newsletterSignupUrl) + '"' + ext + '>Sign up to get it <span aria-hidden="true">→</span></a>'
          : '<a class="btn" href="' + esc(SITE.instagram) + '"' + ext + '>Follow us for updates <span aria-hidden="true">→</span></a>') +
      '</div>';
  }

  /* Full-screen reader for the issue pages */
  if (pages.length) {
    const reader = $("reader");
    $("readerTitle").textContent = n.issue + " · " + n.date;
    $("readerPages").innerHTML = pages.map((p, i) =>
      '<img src="' + esc(img(p)) + '" alt="' + esc(n.issue) + ', page ' + (i + 1) + '" loading="lazy">'
    ).join("");
    const open = () => { reader.hidden = false; document.body.style.overflow = "hidden"; reader.scrollTop = 0; $("readerClose").focus(); };
    const close = () => { reader.hidden = true; document.body.style.overflow = ""; };
    $("readIssue").addEventListener("click", open);
    $("readerClose").addEventListener("click", close);
    reader.addEventListener("click", e => { if (e.target === reader) close(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape" && !reader.hidden) close(); });
  }

  /* Board */
  const silhouette = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="8.5" r="4"/><path d="M4.5 20.5c1.3-3.8 4-5.8 7.5-5.8s6.2 2 7.5 5.8"/></svg>';
  $("board").innerHTML = SITE.board.map(m => {
    const portrait = m.photo
      ? '<img class="portrait" src="' + esc(img(m.photo)) + '" alt="' + esc(m.name || m.role) + '" width="96" height="96">'
      : '<div class="portrait placeholder" aria-hidden="true">' + silhouette + '</div>';
    const filled = Boolean(m.name);
    return '<li class="member">' + portrait +
      '<div class="who">' +
        '<p class="name' + (filled ? "" : " open") + '">' + esc(filled ? m.name : "This role is open") + '</p>' +
        '<p class="role">' + esc(m.role) + '</p>' +
        (filled ? "" : '<a class="apply" href="' + esc(SITE.joinUrl) + '"' + ext + '>Join us and take it on →</a>') +
      '</div></li>';
  }).join("");
})();
</script>
